[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "bms-programming-tool"
version = "0.1.0"
description = "Local building-control graph editor, simulator, format adapters, and commissioning tools"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.146.0", "uvicorn==0.54.0", "pydantic==2.14.1",
  "python-multipart==0.0.32", "defusedxml==0.7.1", "bacpypes3==0.0.110",
  "pyserial==3.5", "httpx==0.28.1", "ifaddr==0.2.0"
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]
dev = ["ruff==0.17.1", "lxml==6.1.3", "pip-audit==2.10.1"]

[project.scripts]
bms-tool = "bms_tool.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
bms_tool = ["data/*.json", "sedona_bridge/*.java"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
