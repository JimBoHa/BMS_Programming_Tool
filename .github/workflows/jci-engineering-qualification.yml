name: JCI engineering qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/bms_tool/jci_source_inspection.py'
      - 'backend/bms_tool/data/jciEngineeringInventory.json'
      - 'backend/bms_tool/app.py'
      - 'backend/bms_tool/caf.py'
      - 'backend/bms_tool/moi_application.py'
      - 'backend/bms_tool/models.py'
      - 'backend/bms_tool/program_source.py'
      - 'tests/test_jci_source_inspection.py'
      - 'tests/jci_engineering_fixtures.py'
      - 'web/src/JciEngineeringDesk.tsx'
      - 'web/src/jciEngineeringContract.ts'
      - 'web/src/jci-engineering.css'
      - 'web/src/Resources.tsx'
      - 'web/src/api.ts'
      - 'web/tests/jci-engineering*'
      - 'scripts/qualify_jci_engineering.py'
      - 'scripts/qualify_native_order.py'
      - '.github/workflows/jci-engineering-qualification.yml'

permissions:
  contents: read

jobs:
  qualification:
    name: engineering (${{ matrix.mode }}, ${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [source, installed]
        browser: [chromium, webkit]
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Trust the isolated mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install reviewed runtime and test tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements/build.txt
          .venv/bin/python -m pip install --require-hashes -r requirements/runtime.txt
          .venv/bin/python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Build the exact UI
        working-directory: web
        run: npm ci && npm run build
      - name: Qualify source or actual installed wheel without retries
        env:
          BMS_MODE: ${{ matrix.mode }}
          BMS_BROWSER: ${{ matrix.browser }}
        run: |
          PYTHONPATH=backend:. .venv/bin/python scripts/qualify_jci_engineering.py --mode "$BMS_MODE" --browser "$BMS_BROWSER" --output "release-output/engineering-$BMS_MODE-$BMS_BROWSER"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: engineering-${{ matrix.mode }}-${{ matrix.browser }}
          path: release-output/engineering-*/
          if-no-files-found: warn
